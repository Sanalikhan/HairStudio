<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1a1a1a"/>

  <!-- Scissors design -->
  <g transform="translate(16, 18)">
    <!-- Left handle -->
    <circle cx="8" cy="8" r="4" fill="none" stroke="#d4a574" stroke-width="1.5"/>

    <!-- Right handle -->
    <circle cx="24" cy="8" r="4" fill="none" stroke="#d4a574" stroke-width="1.5"/>

    <!-- Left blade -->
    <path d="M 8 11 L 16 28" stroke="#d4a574" stroke-width="2" stroke-linecap="round"/>

    <!-- Right blade -->
    <path d="M 24 11 L 16 28" stroke="#d4a574" stroke-width="2" stroke-linecap="round"/>

    <!-- Center pivot -->
    <circle cx="16" cy="19" r="2" fill="#d4a574"/>

    <!-- Decorative accent -->
    <circle cx="16" cy="5" r="1.5" fill="#e6c391"/>
  </g>
</svg>
